name: Recover Orivane 0.2 source
on:
  push:
    branches: [main]
    paths: ['.bootstrap/**', '.github/workflows/recover-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect interrupted transfer
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import zlib from 'node:zlib';
          const parts = fs.readdirSync('.bootstrap').filter(n => /^chunk-.*\.bin$/.test(n)).sort().map(n => fs.readFileSync('.bootstrap/' + n));
          const partial = zlib.brotliDecompressSync(Buffer.concat(parts), {finishFlush:zlib.constants.BROTLI_OPERATION_FLUSH}).toString('utf8');
          console.log('Decoded bytes:', Buffer.byteLength(partial));
          console.log('PAYLOAD PREFIX', JSON.stringify(partial.slice(0, 2000)));
          console.log('PAYLOAD SUFFIX', JSON.stringify(partial.slice(-1200)));
          fs.writeFileSync('/tmp/orivane-partial.json', partial);
          NODE
