name: Recover Orivane 0.2 source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recover-release
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore remaining original release files
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import zlib from 'node:zlib';
          const expected = 'e9f3e097e6838e6853f2339f1c590b9de5e7a675e9bc78fd5fba3094a43a67ea';
          const parts = fs.readdirSync('.bootstrap').filter(n => /^supplement-\d+\.br$/.test(n)).sort().map(n => fs.readFileSync('.bootstrap/' + n));
          const packed = Buffer.concat(parts);
          if (crypto.createHash('sha256').update(packed).digest('hex') !== expected) throw Error('Supplement checksum mismatch');
          const files = JSON.parse(zlib.brotliDecompressSync(packed).toString('utf8'));
          if (Object.keys(files).length !== 30) throw Error('Unexpected supplement size');
          for (const [name, content] of Object.entries(files)) {
            if (path.posix.isAbsolute(name) || name.includes('\\') || name.split('/').some(p => p === '..' || p.startsWith('.')) || typeof content !== 'string') throw Error('Unsafe archive path');
            fs.mkdirSync(path.dirname(name), {recursive:true}); fs.writeFileSync(name, content);
          }
          let verified = 0;
          for (const line of fs.readFileSync('docs/verification/original-release-manifest.sha256','utf8').trim().split('\n')) {
            const match = line.match(/^([a-f0-9]{64})  (.+)$/);
            if (!match || !/^(public|server|tests|tools)\//.test(match[2])) continue;
            if (crypto.createHash('sha256').update(fs.readFileSync(match[2])).digest('hex') !== match[1]) throw Error('Original source mismatch: '+match[2]);
            verified++;
          }
          fs.mkdirSync('docs/verification', {recursive:true});
          fs.writeFileSync('docs/verification/source-recovery.json', JSON.stringify({version:'0.2.0',supplementSha256:expected,restored:Object.keys(files).length,originalSourceFilesVerified:verified,method:'Exact UTF-8 source restoration from checksum-verified release payloads'},null,2)+'\n');
          console.log('Restored 30 files; verified', verified, 'source files against original release SHA-256 manifest');
          NODE
      - name: Test complete application and servers
        run: npm test
      - name: Build standalone release
        run: npm run build
      - name: Commit complete source and remove transfer data
        run: |
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'Complete Orivane 0.2 source import with verified engines, backend, tests and standalone build'
            git push origin HEAD:main
          fi
