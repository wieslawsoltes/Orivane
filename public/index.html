<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f4f8"><meta name="description" content="Orivane — a shared space for better ideas. An editable, collaborative infinite whiteboard."><title>Orivane — Think better, together.</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23f8d964'/%3E%3Cpath d='M10 28V12h5v9l6-9h9l-11 16h-5l11-16h-4L10 28Z' fill='%2326253d'/%3E%3C/svg%3E"><link rel="stylesheet" href="app.css"></head>
<body>
<main id="app" aria-label="Orivane whiteboard editor">
 <div id="viewport"><canvas id="scene" aria-hidden="true"></canvas><canvas id="interaction" tabindex="0" aria-label="Whiteboard canvas. Use V to select, N for a sticky note, T for text. Press question mark for all shortcuts."></canvas><div id="text-edit-layer"></div></div>
 <header class="boardbar glass" id="boardbar">
  <button class="brand" data-action="boards" aria-label="Open workspace"><span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 24V8h5v9l6-9h9L15 24h-5L21 8h-4L6 24Z" fill="currentColor"/></svg></span><span class="brand-name">orivane<span class="brand-dot">.</span></span></button>
  <span class="divider"></span><div class="board-identity"><button id="board-title" class="title-button" data-action="rename">Atlas · Product discovery</button><div class="board-subtitle"><span id="save-dot" class="status-dot"></span><span id="save-status">Loading your board…</span></div></div>
  <button class="icon-button" data-action="board-menu" title="Board menu" aria-label="Board menu" data-icon="more"></button>
 </header>
 <div class="collabbar glass"><div id="participants" class="participants"><button data-action="people" class="avatar" title="You">Y</button></div><span class="divider"></span><button class="icon-button desktop" data-action="comments" title="Comments" aria-label="Comments" data-icon="comment"></button><button class="icon-button desktop" data-action="activity" title="Board activity" aria-label="Board activity" data-icon="history"></button><button class="secondary-button present-button" data-action="present"><span data-icon="present"></span><span>Present</span></button><button class="primary-button" data-action="share"><span data-icon="share"></span><span>Share</span></button></div>
 <div class="workshopbar glass"><button data-action="templates" class="workshop-button"><span data-icon="template"></span><span>Templates</span></button><span class="divider"></span><button class="icon-button" data-action="timer" title="Timer" aria-label="Timer" data-icon="timer"></button><button class="icon-button" data-action="voting" title="Voting" aria-label="Voting" data-icon="vote"></button><button class="icon-button" data-action="reactions" title="Reactions" aria-label="Reactions" data-icon="smile"></button><button class="icon-button" data-action="search" title="Search board (Ctrl+F)" aria-label="Search board" data-icon="search"></button><button class="icon-button" data-action="organize" title="Organize ideas" aria-label="Organize ideas" data-icon="spark"></button></div>
 <nav id="toolbar" class="toolbar glass" aria-label="Creation tools"></nav>
 <div id="properties" class="properties glass hidden" aria-label="Selection properties"></div>
 <aside id="panel" class="sidepanel glass hidden" aria-label="Board panel"></aside>
 <div id="timer-pill" class="timer-pill glass hidden" data-action="timer"></div>
 <div id="voting-pill" class="voting-pill glass hidden" data-action="voting"></div>
 <div class="bottom-left"><div class="history-buttons glass"><button class="icon-button" data-action="undo" title="Undo (Ctrl+Z)" aria-label="Undo" data-icon="undo"></button><button class="icon-button" data-action="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" data-icon="redo"></button><span class="divider"></span><button class="icon-button" data-action="frames" title="Frames and presentation" aria-label="Frames" data-icon="layers"></button></div><div id="engine-badge" class="engine-badge" title="Rendering diagnostics"><span></span><span id="engine-name">Starting engine</span></div></div>
 <div id="hint" class="canvas-hint">A little space for your next big idea.</div>
 <div class="bottom-right"><div id="minimap-wrap" class="minimap-wrap glass hidden"><canvas id="minimap" width="240" height="150" aria-label="Board overview"></canvas></div><div class="zoom-controls glass"><button class="icon-button" data-action="minimap" title="Toggle minimap" aria-label="Toggle minimap" data-icon="map"></button><span class="divider"></span><button class="icon-button" data-action="zoom-out" title="Zoom out" aria-label="Zoom out" data-icon="minus"></button><button id="zoom-value" data-action="zoom-menu">100%</button><button class="icon-button" data-action="zoom-in" title="Zoom in" aria-label="Zoom in" data-icon="plus"></button><button class="icon-button" data-action="fit" title="Fit board (Shift+1)" aria-label="Fit board" data-icon="fit"></button><span class="divider"></span><button class="icon-button" data-action="help" title="Help and shortcuts" aria-label="Help and shortcuts" data-icon="help"></button></div></div>
 <div id="presentation" class="presentation-controls glass hidden"><button data-action="present-prev" class="icon-button" aria-label="Previous frame" data-icon="back"></button><span id="presentation-title"></span><button data-action="present-next" class="icon-button" aria-label="Next frame" data-icon="chevron"></button><span class="divider"></span><button data-action="present-exit" class="secondary-button">Exit presentation <kbd>Esc</kbd></button></div>
 <div id="loading" class="loading"><div class="brand-name">orivane<span class="brand-dot">.</span></div><span>A shared space for better ideas.</span><div class="loading-line"></div></div>
</main>
<div id="popup" class="popup glass hidden" role="menu"></div><div id="modal-root"></div><div id="toast" role="status" aria-live="polite"></div><input id="file-input" type="file" hidden><div id="accessible-objects" class="sr-only" aria-label="Board objects"></div>
<script type="module" src="app.js"></script>
</body></html>
